StylesPath = .github/vale-styles
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Vale, proselint

# A ortografia fica no editor (Code Spell Checker + LTeX+, com dicionário
# pt-BR e o .vscode/dicionario.txt do projeto).
#
# Vale.Spelling usa dicionário en_US quando nenhum é declarado, então
# marcava CADA palavra em português como erro — "Did you really mean
# 'linha'?". Habilitar aqui exigiria versionar um dicionário Hunspell
# pt_BR dentro do repo, e ainda assim acusaria nomes próprios.
Vale.Spelling = NO

# Palavra repetida em sequência — não depende de idioma e é útil em prosa.
Vale.Repetition = YES
